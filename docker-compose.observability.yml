# Observability overlay (ADR-029). Use with the base stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.observability.yml up -d
#
# The local override publishes web on :3000; production omits it and uses the prod overlay with
# Caddy as the only public entry point. `make observe-up` wraps the local command.
#
# The base stack stays telemetry-free: tracing is disabled there. This overlay flips
# MANAGEMENT_TRACING_ENABLED on the API and points the OTLP exporter at the collector.

services:
  api:
    environment:
      MANAGEMENT_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: aether-api

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - aether_prometheus_data:/prometheus
    networks: [aether]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./oncall/webhook-token:/etc/alertmanager/oncall-token:ro
      - aether_alertmanager_data:/alertmanager
    networks: [aether]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Viewer access for the jury: the dashboard contains operational counters, no PII and no
      # image content. Admin stays password-protected.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://localhost:3001/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aether-archive.json
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aether_grafana_data:/var/lib/grafana
    networks: [aether]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [aether]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    ports:
      - "127.0.0.1:16686:16686"
    networks: [aether]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - aether_loki_data:/loki
    networks: [aether]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Promtail needs the Docker socket to know which containers exist. It is read-only, and the
  # process has no-new-privileges. The on-call responder takes the opposite trade-off: it needs to
  # restart services, so it runs on the host instead of mounting a writable socket.
  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    depends_on: [loki]
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
    networks: [aether]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aether_prometheus_data:
    name: aether_prometheus_data
  aether_alertmanager_data:
    name: aether_alertmanager_data
  aether_grafana_data:
    name: aether_grafana_data
  aether_loki_data:
    name: aether_loki_data
