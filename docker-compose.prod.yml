# Production overlay (ADR-029). Use with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Caddy is the only public entry point: it terminates TLS, redirects HTTP to HTTPS, and proxies to
# the internal `web` service. Neither the API nor PostgreSQL publishes a host port.
services:
  api:
    environment:
      AETHER_CORS_ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN must be set for production}

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set for production}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [aether]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    name: aether_caddy_data
  caddy_config:
    name: aether_caddy_config
