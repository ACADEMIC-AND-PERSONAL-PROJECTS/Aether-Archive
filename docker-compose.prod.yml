# Production overlay (ADR-029). Use with the base and observability files:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#     -f docker-compose.prod.yml up -d --build
#
# `make prod-up` and scripts/deploy/deploy.sh wrap that command. Caddy is the only public entry
# point: it terminates TLS, redirects HTTP to HTTPS, proxies the app to the internal `web` service
# and publishes the read-only Grafana dashboards under /grafana/. Neither the API nor PostgreSQL
# publishes a host port; the observability UIs publish only on 127.0.0.1 for an SSH tunnel, never on
# a public interface.
services:
  api:
    environment:
      AETHER_CORS_ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN must be set for production}

  grafana:
    environment:
      # Grafana is behind Caddy at /grafana/. serve_from_sub_path makes its generated links and its
      # API health endpoint use the same prefix.
      GF_SERVER_ROOT_URL: https://${DOMAIN:?DOMAIN must be set for production}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      grafana:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set for production}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [aether]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    name: aether_caddy_data
  caddy_config:
    name: aether_caddy_config
