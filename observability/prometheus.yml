# Prometheus — the metrics store for the demo/production profile (ADR-029).
#
# It scrapes the API's Actuator endpoint over the private compose network; the endpoint is never
# published to the host. The alert rules live beside this file and are evaluated every 15 s.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: demo

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: aether-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: aether-api
          environment: demo

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
