# OpenTelemetry Collector — the single OTLP door for the API.
#
# The backend exports OTLP/HTTP to this collector; the collector batches spans and forwards them to
# the all-in-one Jaeger instance (memory storage, course-demo scale). Keeping the collector in front
# means the exporter endpoint is stable even if the trace backend changes.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
