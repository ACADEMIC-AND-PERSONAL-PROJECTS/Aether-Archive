# Promtail — tails Docker's json-file logs and pushes the API's JSON lines to Loki.
#
# The app writes one JSON object per line (logback-spring.xml) with `traceId` and `spanId`; the
# pipeline below lifts those fields into labels, so Grafana can jump from a log line to its trace.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        regex: aether-archive
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            traceId: traceId
            spanId: spanId
            message: message
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
