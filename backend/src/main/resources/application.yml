spring:
  application:
    name: aether-archive
  profiles:
    default: dev
  # The container's multipart ceilings are deliberately absent here: `config/MultipartConfig` computes
  # them from `aether.storage.max-upload-mb`, so the servlet container and the upload service that
  # enforces the same property cannot disagree (ADR-012). Setting `spring.servlet.multipart.*` would
  # look like configuration and change nothing.
  # Spring Boot does not read `.env` on its own — docker compose does. Importing it as a properties
  # file is what lets the backend and the compose stack share the keys documented in `.env.example`.
  # Both entries are `optional:`, so tests and machines without a `.env` start unchanged, and the
  # paths are relative to the working directory — where the JVM is started, not where the application
  # lives: `../.env` covers `./mvnw spring-boot:run` from `backend/`, `./.env` a run from the
  # repository root. Those two are the supported working directories; started anywhere else, the
  # parent entry may pick up an unrelated `.env`. Real environment variables still win over the file.
  # See backend/README.md.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    # One database server for dev, tests and release (ADR-009): localhost by default, overridable
    # with AETHER_DB_PORT (the port docker-compose.dev.yml publishes) or, as a whole,
    # SPRING_DATASOURCE_URL. A real environment variable wins over the `.env` import.
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${AETHER_DB_PORT:5432}/${POSTGRES_DB:aether}}"
    username: ${POSTGRES_USER:aether}
    password: ${POSTGRES_PASSWORD:change-me-local}
  jpa:
    # Flyway owns the schema (db/migration); Hibernate only checks that the mappings still match it.
    hibernate:
      ddl-auto: validate
    # The web layer maps entities to DTOs inside the service call; no lazy loading after the fact.
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

# Bound and validated at startup by StorageProperties / CorsProperties (E1-S2).
aether:
  storage:
    data-dir: ${AETHER_DATA_DIR:${user.home}/AetherArchive_Data}
    max-upload-mb: ${AETHER_MAX_UPLOAD_MB:15}
  cors:
    allowed-origins: ${AETHER_CORS_ALLOWED_ORIGINS:http://localhost:5173}
