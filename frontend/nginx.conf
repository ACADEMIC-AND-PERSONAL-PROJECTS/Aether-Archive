# Aether Archive — the web container's server (ADR-010, ADR-029).
#
# One origin: the SPA, the API and the images are all served from this host. The resolver line is
# what lets nginx follow the `api` container across a `docker compose up` that recreates it with a
# new address; without it, nginx caches the address it resolved at startup and 502s after a deploy.
#
# Security headers live at server level on purpose: nginx does not inherit `add_header` into a
# location that declares one of its own, so `expires` (not `add_header`) is used for caching.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend's ceiling is 15 MB; multipart framing needs a little room on top.
    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API and images: same origin, no CORS in the browser. Variables force runtime DNS resolution.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /images/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # Hashed assets are immutable; the HTML is not, so a deploy is visible immediately.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback for /river, /curate and /check.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
